# H2 in-memory database configuration for testing
spring.datasource.url=jdbc:h2:mem:auth_system_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# JWT Test Configurations
jwt.secret=mySuperSecretKeyForJwtTokenGeneration123456789mySuperSecretKeyForJwtTokenGeneration123456789
jwt.expiration=86400000
